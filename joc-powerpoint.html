<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misiunea PowerPoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concept: caiet cu pătrățele + fereastra PowerPoint în miniatură, accent portocaliu-cărămiziu */
:root{
  --paper:#fbf6f1; --grid:#ecdfd3; --ink:#2a1a14; --muted:#6e5a50;
  --card:#ffffff; --line:#dcc9bb; --blue:#c24a22; --blue-ink:#ffffff;
  --hi:#ffe14d; --hi-ink:#3a2f00;
  --good:#17693f; --good-bg:#def3e8; --bad:#a82019; --bad-bg:#fbe5e3;
  --win-bar:#b7472a; --win-gray:#e3dcd6; --ribbon:#f5f1ee; --ribbon-line:#d3c9c2;
  --page:#ffffff; --page-ink:#1b1b1b; --key:#f6ece4; --key-line:#c9a891;
  --f-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-b:"Figtree",system-ui,"Segoe UI",sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1210; --grid:#271c18; --ink:#f6ebe4; --muted:#b9a498;
  --card:#271b17; --line:#4a3a32; --blue:#d4562c; --blue-ink:#ffffff;
  --good:#7fe0ac; --good-bg:#12301f; --bad:#ff9a92; --bad-bg:#3a1a18;
  --win-bar:#a5421f; --win-gray:#34302d; --ribbon:#2c2724; --ribbon-line:#473f3a;
  --key:#33271f; --key-line:#7a5f4d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#1a1210; --grid:#271c18; --ink:#f6ebe4; --muted:#b9a498;
  --card:#271b17; --line:#4a3a32; --blue:#d4562c; --blue-ink:#ffffff;
  --good:#7fe0ac; --good-bg:#12301f; --bad:#ff9a92; --bad-bg:#3a1a18;
  --win-bar:#a5421f; --win-gray:#34302d; --ribbon:#2c2724; --ribbon-line:#473f3a;
  --key:#33271f; --key-line:#7a5f4d; color-scheme:dark;}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:18px 48px;min-height:100vh}
.wrap{max-width:980px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}

.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--f-d);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand i{font-style:normal;background:var(--hi);color:var(--hi-ink);padding:0 .3em;border-radius:3px}
.crumb{font-family:var(--f-d);font-weight:700;flex:1;min-width:0}
.xp{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.xp b{color:var(--ink)}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:8px;padding:.7em 1.2em;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:.4em .8em;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}

.start{display:grid;gap:22px;margin-top:6vh;max-width:640px}
.start h1{font-size:clamp(2.2rem,9vw,4.2rem);font-weight:800;letter-spacing:-.03em}
.start h1 mark{background:var(--hi);color:var(--hi-ink);padding:0 .12em;border-radius:4px}
.lead{color:var(--muted);font-size:1.1rem;max-width:56ch}
.namebox{display:flex;gap:10px;flex-wrap:wrap}
.namebox input{flex:1;min-width:200px;font:inherit;font-size:1.1rem;padding:.7em .9em;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.facts li{font-size:.85rem;border:1.5px dashed var(--line);border-radius:999px;padding:.2em .8em;color:var(--muted)}

.h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin-bottom:6px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-block:20px}
.lcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;gap:8px;align-content:start;min-width:0;transition:transform .12s,border-color .12s}
.lcard:hover{transform:translateY(-3px);border-color:var(--blue)}
.lcard .n{font-family:var(--f-d);font-weight:800;font-size:2.4rem;line-height:1;color:var(--blue)}
.lcard h3{font-size:1.2rem}
.lcard p{color:var(--muted);font-size:.93rem}
.stars{display:flex;gap:3px}
.stars svg{width:20px;height:20px;fill:none;stroke:var(--key-line);stroke-width:1.5}
.stars svg.on{fill:var(--hi);stroke:#b89a00}
.rankline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill{background:var(--hi);color:var(--hi-ink);font-weight:700;border-radius:999px;padding:.15em .8em;font-size:.9rem}

.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.mission{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--f-m);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;background:var(--hi);color:var(--hi-ink);padding:.15em .6em;border-radius:3px}
.mission p{font-size:1.12rem;font-weight:600;flex:1;min-width:220px}
.stage{min-width:0}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-weight:500;border:2px solid}
.fb.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.hint{background:var(--card);color:var(--ink);border-color:var(--line)}
.fb b{font-weight:800}
.actions{margin-top:14px;display:flex;justify-content:flex-end}
kbd{font-family:var(--f-m);font-weight:700;font-size:.85em;background:var(--key);border:1.5px solid var(--key-line);border-bottom-width:4px;border-radius:6px;padding:.05em .5em;display:inline-block;color:var(--ink)}
.plus{color:var(--muted);margin-inline:.2em}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.9em 1em;text-align:left;font-weight:600;min-width:0}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);opacity:.8}
.opt[disabled]{cursor:default}
.stmt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:18px;font-size:1.2rem;font-weight:600;margin-bottom:12px}

/* fereastra PowerPoint */
.winscroll{padding-bottom:4px}
.win{min-width:0;border:1px solid var(--ribbon-line);border-radius:8px;overflow:hidden;background:var(--win-gray);box-shadow:0 6px 0 rgba(0,0,0,.12);font-size:12.5px;color:var(--ink)}
.win [data-part]{cursor:pointer;position:relative}
.win [data-part]:hover{outline:2px dashed var(--hi);outline-offset:-2px}
.w-title{background:var(--win-bar);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 10px;min-height:34px}
.w-qa{display:flex;gap:10px;padding:3px 6px;align-items:center}
.w-qa svg,.w-search svg{width:15px;height:15px}
.w-name{flex:1;text-align:center;font-weight:600;min-width:120px}
.w-search{background:rgba(255,255,255,.22);border-radius:4px;padding:3px 10px;display:flex;gap:6px;align-items:center;min-width:130px}
.w-acct{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--win-bar);font-weight:800;display:grid;place-items:center;font-size:10px}
.w-ctl{letter-spacing:.8em;font-size:13px}
.w-tabs{display:flex;flex-wrap:wrap;background:var(--win-bar);padding-inline:6px;gap:2px}
.w-tab{padding:6px 10px 5px;color:#fff;white-space:nowrap;border:0;background:transparent;border-radius:4px 4px 0 0;font-size:12.5px}
.w-tab.act{background:var(--ribbon);color:var(--ink);font-weight:700}
.w-tab.file{background:rgba(0,0,0,.2)}
.w-rib{background:var(--ribbon);display:flex;flex-wrap:wrap;min-height:84px;border-bottom:1px solid var(--ribbon-line)}
.w-grp{padding:6px 10px 3px;border-right:1px solid var(--ribbon-line);border-bottom:1px solid var(--ribbon-line);display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.w-cmds{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;max-width:230px}
.w-cmd{background:var(--card);border:1px solid var(--ribbon-line);border-radius:3px;padding:2px 6px;font-size:11px;white-space:nowrap;color:var(--ink)}
.w-glabel{font-size:10.5px;text-align:center;color:var(--muted);margin-top:4px;white-space:nowrap}
.w-body{display:flex;height:230px}
.w-thumbs{width:92px;background:var(--win-gray);border-right:1px solid var(--ribbon-line);padding:8px;display:grid;gap:8px;align-content:start;overflow:hidden}
.th{display:flex;gap:4px;align-items:flex-start;font-size:10px;color:var(--muted)}
.th i{display:block;flex:1;aspect-ratio:16/9;background:var(--page);border:1px solid var(--ribbon-line)}
.th.act i{outline:2px solid var(--blue)}
.w-center{flex:1;display:flex;flex-direction:column;min-width:0}
.w-doc{flex:1;display:grid;place-items:center;padding:10px;overflow:hidden}
.w-slide{background:var(--page);color:var(--page-ink);aspect-ratio:16/9;height:100%;max-width:100%;box-shadow:0 1px 4px rgba(0,0,0,.35);padding:8px 14px;overflow:hidden}
.w-slide h4{font-family:Georgia,serif;margin:2px 0 6px;font-size:16px;text-align:center}
.w-slide ul{margin:0;padding-left:18px;font-family:Georgia,serif;font-size:11.5px;line-height:1.5}
.w-notes{border-top:1px solid var(--ribbon-line);background:var(--ribbon);color:var(--muted);padding:5px 10px;font-size:11.5px;height:36px}
.w-status{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;background:var(--ribbon);border-top:1px solid var(--ribbon-line);padding:3px 10px;font-size:11.5px}
.w-status .sp{flex:1}
.w-status span[data-part]{padding:2px 6px}
.zoomctl{display:inline-flex;gap:6px;align-items:center}
.zoomctl i{display:block;width:70px;height:2px;background:var(--muted);position:relative}
.zoomctl i::after{content:"";position:absolute;left:50%;top:-4px;width:4px;height:10px;background:var(--ink)}
.win .pinned{outline:2px solid var(--hi);outline-offset:-2px}
.pin{position:absolute;right:6px;bottom:3px;background:var(--hi);color:var(--hi-ink);font:700 11px var(--f-b);font-style:normal;padding:1px 7px;border-radius:3px;pointer-events:none;z-index:3;white-space:nowrap}
.w-title .pin{bottom:auto;top:3px;right:auto;left:40%}
.w-thumbs .pin,.w-notes .pin{right:auto;left:4px}

/* editor de diapozitiv */
.editor{border:1px solid var(--ribbon-line);border-radius:8px;overflow:hidden;background:var(--win-gray);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.tb{display:flex;flex-wrap:wrap;background:var(--ribbon);border-bottom:1px solid var(--ribbon-line);padding:6px 6px 0}
.tgrp{padding:2px 10px 4px;border-right:1px solid var(--ribbon-line);display:flex;flex-direction:column;gap:3px;align-items:center}
.tgrp:last-child{border-right:0}
.tgrp>span{font-size:10.5px;color:var(--muted)}
.trow{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.tbtn{min-width:34px;height:34px;background:var(--card);color:var(--ink);border:1.5px solid var(--ribbon-line);border-radius:5px;display:grid;place-items:center;padding:0 8px;font-family:var(--f-b);font-size:.85rem;font-weight:600}
.tbtn:hover{border-color:var(--blue);background:var(--key)}
.tbtn svg{width:16px;height:14px}
.canvas{padding:14px;display:grid;gap:8px;justify-items:center}
.slidewrap{width:min(100%,640px)}
.slide{aspect-ratio:16/9;background:var(--page);color:var(--page-ink);padding:5% 6%;display:grid;grid-template-rows:auto 1fr;gap:3%;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.35);font-family:Georgia,"Times New Roman",serif;cursor:default;container-type:inline-size}
.slide .obj{cursor:pointer;border-radius:3px;position:relative;margin:0}
.slide .obj:hover{background:rgba(31,111,235,.1)}
.slide h2.obj{font-size:7.2cqw;line-height:1.15;font-weight:700}
.slide .cols{display:grid;grid-template-columns:1.3fr 1fr;gap:5%;align-items:center;min-height:0}
.slide p.obj{font-size:3.6cqw;line-height:1.4}
.slide p.obj.big{font-size:4.8cqw}
.slide p.obj span{display:inline}
.slide p.obj.list span{display:list-item;list-style:disc;margin-left:1.2em}
.slide .pic{height:100%;min-height:0}
.slide .pic svg{width:100%;height:100%;display:block}
.slide .b{font-weight:800}.slide .i{font-style:italic}
.slide .al-c{text-align:center}
.slide.bg{background:#1d2b53;color:#fff}
.slide.bg .obj{color:#fff}
.slide .sel{outline:2px solid #1f6feb;outline-offset:2px}
.slide.sel{outline:3px solid #1f6feb;outline-offset:3px}
.slide .anim::after{content:"★ 1";position:absolute;left:-2px;top:-2px;background:#ffb300;color:#1b1b1b;font:700 3cqw var(--f-b);padding:0 5px;border-radius:3px}
.tbadge{position:absolute;right:6px;bottom:6px;font:700 2.8cqw var(--f-b);font-style:normal;background:#ffb300;color:#1b1b1b;padding:1px 8px;border-radius:3px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.thumbs i{display:block;width:60px;aspect-ratio:16/9;background:var(--page);border:1px solid var(--ribbon-line)}
.thumbs i.on{outline:2px solid var(--blue)}

/* greșeli de design */
.hwrap{padding-right:34px}
.hslide{background:#fff;color:#1b1b1b;border:2px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px;position:relative}
.hp{display:block;text-align:left;background:transparent;border:2px solid transparent;border-radius:6px;padding:4px 6px;color:#1b1b1b;font:inherit;cursor:pointer;min-width:0}
.hp:hover{border-color:#999}
.hp.mark{outline:3px solid #ffb300;background:rgba(255,225,77,.35)}
.hp.hit{outline:3px solid #1b8a54;background:#c9f0da}
.hp.miss{outline:3px dashed #c0392b;background:#ffd9d6}
.hp.fals{outline:3px solid #999;background:#eee}
.hp-t{font:800 1.9rem Georgia,serif;color:#e8dc55}
.hp-wall{font-size:.78rem;line-height:1.25}
.hp-tiny{font-size:9px}
.hp-fonts{font-size:1.1rem}
.hp-fonts span:nth-child(1){font-family:"Courier New",monospace}
.hp-fonts span:nth-child(2){font-family:Georgia,serif;font-style:italic}
.hp-fonts span:nth-child(3){font-family:Impact,"Arial Black",sans-serif}
.hp-fonts span:nth-child(4){font-family:"Comic Sans MS",cursive}
.hp-col{font-size:1.2rem;font-weight:700}
.hp-out{width:150px;transform:translateX(24px)}
.hp-out svg,.hp-ok svg{display:block;width:100%;height:auto}
.hp-ok{width:130px}
.hp-good{font:700 1.3rem Georgia,serif;color:#1d2b53}
.hunt-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.why{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.95rem}
.why li{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:.5em .8em}

.res{display:grid;gap:16px;justify-items:start;margin-top:4vh;max-width:620px}
.res .big{display:flex;gap:8px}
.res .big svg{width:60px;height:60px;fill:none;stroke:var(--key-line);stroke-width:1.5}
.res .big svg.on{fill:var(--hi);stroke:#b89a00;animation:pop .5s both}
.res .big svg:nth-child(2){animation-delay:.15s}.res .big svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.res h2{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.recap{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
.dip{background:var(--card);color:var(--ink);border:3px double var(--blue);outline:2px solid var(--blue);outline-offset:6px;border-radius:6px;padding:clamp(20px,5vw,48px);text-align:center;display:grid;gap:12px;max-width:720px;margin:24px auto}
.dip small{font-family:var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dip h2{font-size:clamp(1.8rem,7vw,3rem);font-weight:800}
.dip .stars{justify-content:center}
.dip .nm{font-family:var(--f-d);font-weight:800;font-size:clamp(2rem,8vw,3.4rem);background:linear-gradient(transparent 62%,var(--hi) 62%);justify-self:center;padding-inline:.2em;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
<div id="app"></div>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var app=$('#app');
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function zeros(){return [0,0,0,0,0,0,0,0]}

var KEY='misiunea-powerpoint-v1';
var S={name:'',best:zeros(),stars:zeros()};
try{var raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.best&&raw.best.length===8&&raw.stars&&raw.stars.length===8){S=raw}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var TOT=[8,9,11,10,8,10,12,8], MAXXP=sum(TOT)*10;
function rankOf(xp){var r=xp/MAXXP;return r>=.88?'Maestru PowerPoint':r>=.65?'Expert în prezentări':r>=.42?'Designer de diapozitive':r>=.18?'Utilizator':'Începător'}
function starSvg(on){return '<svg viewBox="0 0 24 24" class="'+(on?'on':'')+'"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" stroke-linejoin="round"/></svg>'}
function stars(n,cls){var h='';for(var i=0;i<3;i++)h+=starSvg(i<n);return '<div class="'+(cls||'stars')+'" aria-label="'+n+' din 3 stele">'+h+'</div>'}
function keys(s){return s.split('+').map(function(k){return '<kbd>'+k+'</kbd>'}).join('<span class="plus">+</span>')}
function clearKeys(){document.onkeydown=null}

function start(){
  clearKeys();
  app.innerHTML='<div class="wrap start"><div class="brand">Informatică · clasa a VI-a</div>'+
  '<h1>Misiunea <mark>PowerPoint</mark></h1>'+
  '<p class="lead">Opt misiuni din Unitatea 1: prezentări electronice și Microsoft PowerPoint. Recunoști tipurile de prezentări, explorezi fereastra și panglica, construiești un diapozitiv, descoperi greșelile de design și te pregătești să susții prezentarea.</p>'+
  '<form class="namebox" id="nf"><input id="nm" autocomplete="off" maxlength="30" placeholder="Cum te cheamă?" value="'+(S.name||'').replace(/"/g,'')+'" aria-label="Numele tău"><button class="btn" type="submit">'+(S.name?'Continuă':'Începe')+'</button></form>'+
  '<ul class="facts"><li>8 misiuni</li><li>76 de întrebări și sarcini</li><li>stele și puncte XP</li><li>diplomă la final</li></ul></div>';
  $('#nf').onsubmit=function(e){e.preventDefault();S.name=$('#nm').value.trim()||'Elev';save();hub()};
  $('#nm').focus();

function play(idx,items,renderItem,setup){
  shell(idx);
  var R={ok:0,fail:0,total:items.reduce(function(a,x){return a+(x.w||1)},0)};
  var stage=$('#stage'),fb=$('#fb'),next=$('#next'),pr=$('#pr'),pf=$('#pf');
  var i=0;
  if(setup)setup(stage);
  function show(){
    fb.hidden=true;next.hidden=true;
    pf.style.width=(i/items.length*100)+'%';
    var tried=false,fin=false;
    var it=items[i];
    function reveal(cls,html){fb.className='fb '+cls;fb.innerHTML=html;fb.hidden=false}
    function ready(){next.hidden=false;next.textContent=(i===items.length-1)?'Vezi rezultatul →':'Continuă →';next.focus()}
    var api={stage:stage,
      prompt:function(h){pr.innerHTML=h},
      hint:function(h){reveal('hint',h)},
      right:function(msg){if(fin)return;fin=true;if(!tried)R.ok+=(it.w||1);tried=true;reveal('good','<b>Corect!</b> '+(msg||''));ready()},
      wrong:function(msg){if(fin)return;if(!tried){R.fail++;tried=true}reveal('bad','<b>Încă nu.</b> '+(msg||'Mai încearcă.'))},
      partial:function(n,html){if(fin)return;fin=true;tried=true;R.ok+=n;reveal('good',html);ready()}
    };
    if(!setup)stage.innerHTML='';
    renderItem(it,api,i);
  }
  next.onclick=function(){i++;if(i>=items.length){pf.style.width='100%';results(idx,R)}else{show();window.scrollTo(0,0)}};
  show();
}
function mcq(api,it){
  var opts=shuffle(it.o.map(function(t,k){return {t:t,ok:k===0}}));
  api.stage.innerHTML='<div class="opts">'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o.t+'</button>'}).join('')+'</div>';
  var done=false;
  $$('.opt',api.stage).forEach(function(b,k){b.onclick=function(){
    if(done)return;
    if(opts[k].ok){done=true;b.classList.add('ok');$$('.opt',api.stage).forEach(function(x){x.disabled=true});api.right(it.fact)}
    else{b.classList.add('no');b.disabled=true;api.wrong(it.hint||'Nu este varianta aceasta. Încearcă alta.')}
  }});
}
function results(idx,R){
  var ratio=R.ok/R.total, n=ratio>=.9?3:ratio>=.6?2:1, gain=R.ok*10;
  S.best[idx]=Math.max(S.best[idx],gain);S.stars[idx]=Math.max(S.stars[idx],n);save();
  var msg=n===3?'Perfect! Ești gata de prezentare.':n===2?'Foarte bine! Mai încearcă o dată pentru trei stele.':'Ai terminat misiunea. Rejoacă pentru mai multe stele.';

  '<div class="res">'+stars(n,'big')+'<h2>'+msg+'</h2><p class="lead">Din prima ai răspuns corect la <b>'+R.ok+' din '+R.total+'</b>. Ai câștigat <b>'+gain+' XP</b>.</p>'+

  $('#nx').onclick=function(){if(idx<LV.length-1)LV[idx+1].run();else if(all)diploma();else hub()};

}

function lvl5(){
  var cur=null,sel=null,hist=[],sl=null,count=1;
  function snap(){return {h:sl.innerHTML.replace(/ ?\bsel\b/g,''),c:sl.className.replace(/ ?\bsel\b/g,''),n:count}}
  function target(id){return id==='fundal'?sl:sl.querySelector('[data-id="'+id+'"]')}
  function select(el){if(sel)sel.classList.remove('sel');sel=el;if(el)el.classList.add('sel')}
  function upd(){
    $('#meta').textContent='Diapozitivul 1 din '+count;
    var h='';for(var k=0;k<count;k++)h+='<i class="'+(k===0?'on':'')+'"></i>';
    $('#th').innerHTML='<span>Miniaturi:</span>'+h;
    var tr=sl.classList.contains('trans');
    var b=$('#tbadge');b.hidden=!tr;
  }
  function check(){
    if(!cur||cur.done)return;
    var t=cur.t,ok;
    if(t.n)ok=count>1;
    else ok=t.w.every(function(w){var e=target(w[0]);return e&&e.classList.contains(w[1])});
    if(ok){cur.done=true;select(null);cur.api.right(t.f)}
  }
  var TXTACT=['b','i','big','al-c','list'];
  function act(c){
    if(!cur||cur.done)return;
    if(c==='new'){hist.push(snap());count++;upd();check();return}
    if(!sel){cur.api.hint('Mai întâi <b>selectează</b> un obiect: click pe titlu, pe text, pe imagine sau pe spațiul liber al diapozitivului. Apoi alege comanda.');return}
    var tg=sel,id=tg.dataset.id;
    if((c==='bg'||c==='trans')&&id!=='fundal'){cur.api.hint('Fundalul și tranziția se aplică <b>diapozitivului</b>: click pe spațiul liber al diapozitivului, nu pe un obiect.');return}
    if(TXTACT.indexOf(c)>-1&&(id==='fundal'||id==='poza')){cur.api.hint('Comanda aceasta formatează <b>textul</b>. Selectează titlul sau caseta de text.');return}
    if(c==='anim'&&id==='fundal'){cur.api.hint('Animațiile se aplică <b>obiectelor</b> (text, imagine), nu diapozitivului. Pentru diapozitiv folosești tranziția.');return}
    hist.push(snap());
    tg.classList.toggle(c);
    var on=tg.classList.contains(c);
    var wanted=cur.t.w&&cur.t.w.some(function(w){return w[0]===id&&w[1]===c});
    upd();
    if(on&&!wanted)cur.api.wrong('Comanda a fost aplicată pe alt obiect decât cel cerut. Apasă <b>Anulează</b> (<kbd>Ctrl</kbd>+<kbd>Z</kbd>) și încearcă iar.');
    check();
  }
  function undo(){
    if(!hist.length||!cur||cur.done)return;
    var s=hist.pop();sl.innerHTML=s.h;sl.className=s.c;count=s.n;sel=null;upd();cur.api.hint('Modificare anulată.');
  }
  play(4,T5.map(function(t){return {t:t}}),function(it,api){api.prompt(it.t.p);cur={t:it.t,api:api,done:false}},function(stage){
    stage.innerHTML='<div class="editor"><div class="tb">'+
     '<div class="tgrp"><div class="trow"><button class="tbtn" data-u="1" title="Anulare (Ctrl+Z)">↶ Anulează</button><button class="tbtn" data-a="new" title="Diapozitiv nou (Ctrl+M)">+ Diapozitiv nou</button></div><span>Acțiuni</span></div>'+
     '<div class="tgrp"><div class="trow"><button class="tbtn" data-a="b" title="Aldin (Ctrl+B)"><b>B</b></button><button class="tbtn" data-a="i" title="Cursiv (Ctrl+I)"><i>I</i></button><button class="tbtn" data-a="big" title="Mărește fontul">A+</button></div><span>Font</span></div>'+
     '<div class="tgrp"><div class="trow"><button class="tbtn" data-a="list" title="Marcatori">• Marcatori</button><button class="tbtn" data-a="al-c" title="Centrare (Ctrl+E)">Centrare</button></div><span>Paragraf</span></div>'+
     '<div class="tgrp"><div class="trow"><button class="tbtn" data-a="bg" title="Formatare fundal">Formatare fundal</button></div><span>Proiectare</span></div>'+
     '<div class="tgrp"><div class="trow"><button class="tbtn" data-a="anim" title="Animație: Apariție">Apariție</button></div><span>Animații</span></div>'+
     '<div class="tgrp"><div class="trow"><button class="tbtn" data-a="trans" title="Tranziție: Împingere">Împingere</button></div><span>Tranziții</span></div></div>'+
     '<div class="canvas"><div class="slidewrap"><div class="slide" id="sl" data-id="fundal"><h2 class="obj" data-id="titlu">Toamna în România</h2>'+
     '<div class="cols"><p class="obj" data-id="corp"><span>Frunzele cad și se colorează. </span><span>Păsările călătoare pleacă spre sud. </span><span>Zilele se scurtează.</span></p><div class="obj pic" data-id="poza">'+SCENE+'</div></div><em class="tbadge" id="tbadge" hidden>Tranziție: Împingere</em></div></div>'+
     '<div class="thumbs" id="th"></div><div class="xp" id="meta"></div></div></div>';
    sl=$('#sl',stage);upd();
    $$('.tbtn',stage).forEach(function(b){b.onmousedown=function(e){e.preventDefault()};b.onclick=function(){if(b.dataset.u)undo();else act(b.dataset.a)}});
    sl.addEventListener('click',function(e){var o=e.target.closest('.obj');select(o||sl)});
    var map={b:'b',i:'i',e:'al-c',m:'new'};
    document.onkeydown=function(e){
      if(!(e.ctrlKey||e.metaKey))return;
      var k=e.key.toLowerCase();
      if(k==='z'){e.preventDefault();undo()}
      else if(map[k]){e.preventDefault();act(map[k])}
    };
  });
}
