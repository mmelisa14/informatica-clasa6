<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grile 3D și Animație</title>
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#1b2433;--mu:#4f5b70;--bd:#d9d4f5;--ac:#7c3aed;--ok:#2f9e44;--no:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f24;--card:#1c1838;--tx:#f0edff;--mu:#b4aed6;--bd:#342f63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f24;--card:#1c1838;--tx:#f0edff;--mu:#b4aed6;--bd:#342f63;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.1rem;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 6px;text-align:center;background:linear-gradient(90deg,#f08c00,#d6336c,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.sub{text-align:center;color:var(--mu);margin:0 0 20px}
.big{font-size:4.5rem;text-align:center;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.big,.conf{animation:none}}
.modes{display:grid;gap:12px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.mode{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:16px;border:2px solid var(--bd);background:var(--card);min-height:64px}
.mode:active,.opt:active{transform:scale(.98)}
.mode .e{font-size:2.2rem}
.mode small{display:block;color:var(--mu)}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f08c00,#d6336c,#7c3aed);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-weight:700;margin-bottom:8px}
.q{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px}
.q h2{margin:0 0 12px;font-size:1.3rem;line-height:1.3}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);min-height:50px}
.opt.ok{border-color:var(--ok);background:rgba(47,158,68,.25)}
.opt.no{border-color:var(--no);background:rgba(224,49,49,.22)}
.opt:disabled{cursor:default}
.fb{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);border-left:6px solid var(--ac)}
.go{display:none;margin:14px auto 0;padding:13px 30px;border:0;border-radius:99px;background:var(--ac);color:#fff;font-weight:800;font-size:1.1rem}
.score{font-size:3rem;font-weight:800;text-align:center}
.msg{text-align:center;font-size:1.3rem;margin:4px 0 16px}
.miss{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:10px 14px;margin:10px 0}
.miss b{color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.row button{padding:13px 24px;border-radius:99px;border:2px solid var(--bd);background:var(--card);font-weight:800}
.row .p{background:var(--ac);border-color:var(--ac);color:#fff}
.conf{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall 2.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
</style>
</head>
<body>
<main>
<div id="home">
 <div class="big">🧊</div>
 <h1>Grile 3D și Animație</h1>
 <p class="sub">Alege un set și răspunde la 10 întrebări. După fiecare răspuns afli explicația!</p>
 <div class="modes">
  <button class="mode" data-m="0"><span class="e">🧊</span><span><b>Teorie 3D</b><small>forme, modele, texturi, lumină</small></span></button>
  <button class="mode" data-m="1"><span class="e">🎬</span><span><b>Teorie animație</b><small>cadre, keyframe-uri, timeline, principii</small></span></button>
  <button class="mode" data-m="2"><span class="e">🏁</span><span><b>Mix surpriză</b><small>întrebări amestecate din ambele</small></span></button>
 </div>
</div>
<div id="play" style="display:none">
 <div class="meta"><span id="no"></span><span id="sc"></span></div>
 <div class="bar"><i id="pb"></i></div>
 <div class="q"><h2 id="qt"></h2><div id="ops"></div><div class="fb" id="fb"></div></div>
 <button class="go" id="nx">Următoarea →</button>
</div>
<div id="end" style="display:none">
 <div class="big" id="ee">🏆</div>
 <div class="score" id="es"></div>
 <p class="msg" id="em"></p>
 <div id="ms"></div>
 <div class="row"><button class="p" id="again">🔁 Încă o dată</button><button id="menu">☰ Alt set</button></div>
</div>
</main>
<script>
/* [categorie, întrebare, [corect, greșit, greșit], explicație]  0 = 3D, 1 = animație */
var DB=[
[0,"Care sunt cele trei dimensiuni ale unui obiect 3D?",["Lungime, lățime și înălțime","Culoare, formă și mărime","Sus, jos și stânga"],"Un obiect 3D are lungime, lățime și înălțime (adâncime). De aceea îl putem privi din toate părțile."],
[0,"Care e diferența dintre 2D și 3D?",["3D are și adâncime","2D are mai multe culori","3D e mereu alb-negru"],"Un desen 2D e plat, ca o foaie de hârtie. Un obiect 3D are adâncime și poate fi învârtit."],
[0,"Câte axe are spațiul 3D?",["Trei: X, Y și Z","Două: X și Y","Patru: A, B, C și D"],"Poziția unui obiect se dă cu trei axe: X, Y și Z. În 2D sunt doar două, X și Y."],
[0,"Cum se numește „plasa” de fețe mici care formează forma unui obiect 3D?",["Mesh","Timeline","Filtru"],"Mesh înseamnă plasă. Este alcătuit din puncte, linii și fețe, de obicei triunghiuri."],
[0,"Cum se numește un punct (colț) dintr-un model 3D?",["Vertex (vârf)","Pixel","Cadru"],"Vertex-urile sunt punctele care leagă muchiile și fețele unui model."],
[0,"Cub, sferă, cilindru și con sunt…",["Forme 3D de bază (primitive)","Texturi","Animații"],"Din forme simple, numite primitive, poți construi aproape orice: un robot, o casă, o mașină."],
[0,"Ce este o textură?",["O imagine „înfășurată” pe obiect, ca să pară din lemn sau piatră","Un sunet pentru joc","Un fel de lumină"],"Textura dă suprafeței aspectul unui material: lemn, nisip, metal, piatră."],
[0,"Ce face lumina într-o scenă 3D?",["Arată forma obiectelor și creează umbre","Face obiectele mai mici","Șterge culorile"],"Lumina și umbrele ne ajută să vedem că un obiect e rotund sau colțuros. Fără ele totul ar părea plat."],
[0,"Cum se numește procesul prin care computerul face imaginea finală dintr-o scenă 3D?",["Randare (render)","Copiere","Rotire"],"La randare computerul calculează lumina, umbrele și culorile și produce imaginea sau filmul gata făcut."],
[0,"Ce face unealta „Scale” (scalare)?",["Schimbă mărimea obiectului","Îl colorează","Îl șterge"],"Move mută, Rotate învârte, iar Scale face obiectul mai mare sau mai mic."],
[0,"Un model cu foarte multe triunghiuri este…",["Mai detaliat, dar mai greu pentru computer","Mereu mai rapid","Mereu mai mic"],"Mai multe triunghiuri înseamnă forme mai netede și mai detaliate, dar și mai multă muncă pentru calculator."],
[0,"Unde vedem grafică 3D?",["În jocuri, filme animate și la proiectarea clădirilor","Doar în cărți","Doar în caiete"],"Grafica 3D e peste tot: jocuri video, filme, reclame, arhitectură și chiar medicină."],
[1,"Ce este animația?",["Iluzia mișcării creată dintr-o serie de imagini care se schimbă rapid","O poză foarte mare","Un tip de culoare"],"Imaginile se succed atât de repede, încât creierul nostru le vede ca pe o mișcare."],
[1,"Cum se numește fiecare imagine dintr-o animație?",["Cadru (frame)","Vertex","Textură"],"Un film sau un joc e format din multe cadre afișate unul după altul."],
[1,"Ce înseamnă „24 FPS”?",["24 de cadre pe secundă","24 de culori","24 de personaje"],"FPS vine de la „frames per second”. Cu cât sunt mai multe cadre pe secundă, cu atât mișcarea pare mai lină."],
[1,"Ce este un keyframe (cadru-cheie)?",["Un moment în care stabilești poziția sau starea importantă a obiectului","Un buton care șterge animația","Un fel de sunet"],"Tu alegi cadrele-cheie, de exemplu start și sosire, iar computerul se ocupă de ce e între ele."],
[1,"Cum se numește calculul făcut de computer pentru mișcarea dintre două keyframe-uri?",["Interpolare (tweening)","Randare","Copiere"],"Interpolarea umple singură cadrele de „la mijloc”. Așa se mișcă o mașină între două rombi pe timeline."],
[1,"Ce este timeline-ul?",["Linia de timp pe care așezi cadrele-cheie","O unealtă de desenat","O culoare"],"Pe timeline vezi când se întâmplă fiecare lucru: când pornește mașina, când sare personajul."],
[1,"Cum faci o mișcare mai rapidă pe timeline?",["Apropii keyframe-urile în timp","Le depărtezi în timp","Schimbi culoarea obiectului"],"Dacă același drum trebuie parcurs în mai puțin timp, obiectul se mișcă mai repede."],
[1,"O animație care se repetă la nesfârșit se numește…",["Buclă (loop)","Randare","Mesh"],"Loop-urile sunt folosite pentru mers, roți care se învârt sau apă care curge."],
[1,"Ce face „ease in / ease out”?",["Pornește și se oprește lin, nu brusc","Face obiectul invizibil","Dublează viteza"],"Mașinile reale accelerează și frânează treptat. Ease in și ease out dau mișcării un aspect natural."],
[1,"Mingea se turtește puțin când lovește podeaua. Cum se numește acest principiu?",["Squash și stretch","Loop","Render"],"Comprimarea și întinderea fac obiectele să pară moi, vii și amuzante."],
[1,"Personajul se lasă puțin în jos înainte să sară. Cum se numește acest principiu?",["Anticipare","Interpolare","Texturare"],"Mica pregătire dinainte arată publicului că urmează o mișcare mare."],
[1,"Ce este „rig-ul” unui personaj 3D?",["Scheletul invizibil care ajută la mișcarea lui","Culoarea lui","Numele lui"],"Oasele și articulațiile din rig lasă animatorul să miște brațele, picioarele și capul."],
[1,"Cum se face animația stop-motion?",["Fotografiind obiecte reale mutate puțin câte puțin","Doar cu computerul, fără obiecte","Desenând pe un singur cadru"],"După fiecare mișcare mică se face o poză. Poze puse la rând dau iluzia mișcării."]
];
function $(i){return document.getElementById(i)}
var set=[],qi=0,pts=0,mode=0,miss=[],lock=false;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["home","play","end"].forEach(function(x){$(x).style.display=x===id?"block":"none"});window.scrollTo(0,0)}
function start(m){mode=m;var pool=DB.filter(function(q){return m===2||q[0]===m});set=sh(pool).slice(0,10);qi=0;pts=0;miss=[];show("play");ask()}
function ask(){lock=false;var q=set[qi];$("no").textContent="Întrebarea "+(qi+1)+" din "+set.length;$("sc").textContent="⭐ "+pts;$("pb").style.width=(qi/set.length*100)+"%";
 $("qt").textContent=q[1];$("fb").style.display="none";$("nx").style.display="none";var ops=$("ops");ops.innerHTML="";
 sh([0,1,2]).forEach(function(k){var b=document.createElement("button");b.className="opt";b.textContent=q[2][k];b.onclick=function(){pick(b,k===0)};ops.appendChild(b)})}
function pick(b,ok){if(lock)return;lock=true;var q=set[qi];
 [].forEach.call($("ops").children,function(x){x.disabled=true;if(x.textContent===q[2][0])x.classList.add("ok")});
 if(ok)pts++;else{b.classList.add("no");miss.push(q)}
 $("sc").textContent="⭐ "+pts;var f=$("fb");f.innerHTML="<b>"+(ok?"✅ Corect! ":"❌ Nu chiar. ")+"</b>"+q[3];f.style.display="block";
 var n=$("nx");n.textContent=qi===set.length-1?"Vezi rezultatul 🏆":"Următoarea →";n.style.display="block"}
$("nx").onclick=function(){qi++;if(qi<set.length)ask();else fin()};
function conf(){var e=["🎉","⭐","🧊","🎬","✨","🏆"];for(var i=0;i<36;i++){var s=document.createElement("span");s.className="conf";s.textContent=e[i%6];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},3600,s)}}
function fin(){show("end");var n=set.length;$("es").textContent=pts+" din "+n;
 $("ee").textContent=pts>=9?"🏆":pts>=6?"👏":"💪";
 $("em").textContent=pts>=9?"Ești expert în 3D și animație!":pts>=6?"Bravo! Mai ai puțin până la expert.":"Încearcă din nou, te descurci tot mai bine!";
 var ms=$("ms");ms.innerHTML="";if(miss.length){var h=document.createElement("p");h.textContent="Merită să mai repeți:";h.style.fontWeight="700";ms.appendChild(h);
  miss.forEach(function(q){var d=document.createElement("div");d.className="miss";var b=document.createElement("b");b.textContent=q[1];d.appendChild(b);d.appendChild(document.createElement("br"));d.appendChild(document.createTextNode("Răspuns corect: "+q[2][0]));ms.appendChild(d)})}
 if(pts>=8)conf()}
document.querySelectorAll(".mode").forEach(function(b){b.onclick=function(){start(+b.dataset.m)}});
$("again").onclick=function(){start(mode)};$("menu").onclick=function(){show("home")};
</script>
</body>
</html>
